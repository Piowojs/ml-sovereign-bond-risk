# Central hyperparameter file for the thesis pipeline (per CLAUDE.md: never
# hardcode a hyperparameter in code — it belongs here so it can feed the
# sensitivity analysis in thesis §5.5). Sections are added as each stage
# starts needing tunable parameters; macro_acquisition is the first.

macro_acquisition:
  start_date: "2005-01-01"
  end_date: "2025-12-31"
  # Publication lag: how long after a period ends its value could actually
  # be used at a rebalancing date without look-ahead bias. See CLAUDE.md
  # bias-prevention rules (World Bank / IMF WEO lags are typically 3-6
  # months) and the vintage-data caveat documented there.
  lag_months_world_bank: 6
  lag_months_imf_weo: 6
  lag_days_fred: 1
  # Coverage cells (country x series, % non-missing over the sample period)
  # below this are flagged in the coverage report and logged as warnings.
  coverage_warning_threshold: 0.5
  output_dir: "data/raw/macro"
  cache_dir: "data/raw/macro/_cache"

# Stage 1: country x quarter feature matrix (src/stage1_clustering/build_feature_matrix.py).
stage1_feature_matrix:
  start_date: "2005-01-01"
  end_date: "2025-12-31"
  # Extended tier = DM + EM countries whose MOD_DURTN/CONVEXITY non-null
  # coverage (over the country's full raw bond history) meets this
  # threshold. Gated on duration/convexity, not CDS, because INT_CDS is
  # essentially DM-only in the raw pull (see CLAUDE.md). Candidate for the
  # thesis's §5.5 sensitivity sweep (0.6/0.7/0.8) once Stage 1 clustering
  # results exist.
  extended_tier_min_duration_convexity_coverage: 0.7
  output_dir: "data/processed"

# Stage 1: unsupervised sovereign risk classification (thesis Sec 4.2,
# src/stage1_clustering/algorithm_comparison.py + build_risk_labels.py).
# Reads the feature matrices this stage's build_feature_matrix.py already
# produced. See CLAUDE.md "Stage 1 clustering" for the full writeup of why
# these choices were made (feature set, imputation, tier mapping).
stage1_clustering:
  # Feature set used for clustering, per thesis Sec 3.3's declared groups
  # -- specifically the "Stage" column of the Group C table, which scopes
  # VIX and DXY to Stage 2 only (global risk appetite / EM funding
  # pressure -- time-series signals for return prediction) and marks only
  # curve_slope and us_10y level as "1 & 2". vix/dxy_proxy are
  # deliberately excluded here, not just an oversight fixed later: they
  # were tried in an early version of this feature set and produced a
  # concrete failure mode worth recording -- since global features are
  # identical across all 44 countries within a given quarter (zero
  # within-quarter/cross-sectional variance, all their variance is
  # across time), a pooled full-sample fit let them dominate the distance
  # metric and collapse entire quarters into a single risk tier
  # regardless of country (e.g. 2008-2015 had zero countries in
  # core-eligible; 2023/2025 had zero in excluded/satellite) -- a
  # global-regime artifact, not country risk differentiation. Restricting
  # to the thesis's actual Stage-1-scoped Group C features (us_10y,
  # curve_slope) both matches the spec and substantially reduces this
  # effect -- see CLAUDE.md "Stage 1 clustering" for the full writeup and
  # the residual version of this effect that persists even after the fix.
  # us_2y is also excluded -- already fully captured by curve_slope
  # (= us_10y - us_2y); including both would double-count that signal.
  core_features:
    - yield_spread_bps
    - debt_gdp
    - fiscal_bal_gdp
    - current_acct_gdp
    - fx_reserves_mo
    - cpi_inflation
    - real_gdp_growth
    - political_stability
    - us_10y
    - curve_slope
  # Extended tier adds duration/convexity. cds_5y is deliberately excluded
  # from the clustering feature vector (not just left sparse) -- at 82%
  # missing (see CLAUDE.md), a clustering feature that's four-fifths
  # median-imputed contributes near-zero real signal and mostly imputation
  # noise; it stays in the parquet for inspection but is never fed to
  # KMeans/GMM/HDBSCAN.
  extended_additional_features:
    - mod_duration
    - convexity
  # A country-quarter row needs at least this fraction of its tier's
  # feature columns actually observed (non-imputed) to receive a real
  # cluster label; below this it gets risk_label="insufficient_data"
  # rather than a label built mostly from imputed values. This is what
  # correctly suppresses labeling in 2005-2006, before macro fundamentals
  # are publishable yet (see CLAUDE.md's macro publication-lag section).
  min_observed_feature_frac: 0.5
  # Minimum training-window rows required (as a multiple of k) before the
  # walk-forward labeler will fit a model at all -- guards the earliest
  # quarters, where even the countries above the observed-feature
  # threshold don't yet give KMeans/GMM enough rows to fit meaningfully.
  min_training_rows_per_k: 15
  kmeans_gmm_k_range: [2, 3, 4, 5, 6, 7, 8]
  # HDBSCAN has no k parameter; swept as a fraction of the analysis
  # sample size instead (min_cluster_size = frac * n_rows, floored at 10).
  hdbscan_min_cluster_size_fracs: [0.01, 0.02, 0.05]
  random_state: 42
  # Filled in by algorithm_comparison.py's findings -- see CLAUDE.md
  # "Stage 1 clustering" for the justification, not just a K-Means default.
  chosen_algorithm: "kmeans"
  chosen_tier: "core"
  chosen_k: 3
  output_dir: "data/processed"

# Stage 2: compensated EM sovereign risk identification (thesis Sec 4.3,
# src/stage2_signal/). Operates only on the subset of Stage 1's output
# (data/processed/stage1_risk_labels.parquet) with dm_em_flag == "EM" and
# risk_label == "satellite-candidate" at each rebal_date -- per thesis
# Sec 4.4.1's sleeve definition and Ch.1's framing ("compensated EM
# sovereign risk"), never the occasional DM rows that land in
# satellite-candidate under Stage 1's known residual global-feature
# regime artifact (see CLAUDE.md "Stage 1 clustering").
stage2_signal:
  start_date: "2005-01-01"
  end_date: "2025-12-31"
  # Risk-free leg for the excess-return target (thesis Sec 4.3.2): the
  # 3-month US T-bill, added to macro_pull.py's FRED_SERIES for this stage
  # (issue #5) -- was not previously pulled anywhere in the repo.
  risk_free_series: "us_3m_tbill_yield"
  risk_free_country_tag: "United States"
  # Bond price series priority for total-return construction, highest
  # first. DIRTY_PRC embeds accrued interest (closest available proxy to
  # true total return, since no explicit coupon-rate/cashflow field exists
  # anywhere in the raw pull -- see CLAUDE.md "Stage 2 signal" for the full
  # gap writeup). CLEAN_PRC/MID_PRICE are pure price series (no income
  # component -- flagged per row via has_income_component, not silently
  # treated as equivalent). synthetic_mid/BID are the last-resort fallback
  # for the 2 countries (Kazakhstan, Morocco) with no MID_PRICE/CLEAN_PRC
  # column at all.
  price_field_priority: ["DIRTY_PRC", "CLEAN_PRC", "MID_PRICE", "synthetic_mid", "BID"]
  # Momentum lookback windows (thesis Sec 3.3 Group A: "1m/3m/12m return
  # momentum", Stage-2-scoped only) and the as-of tolerance (days) allowed
  # when looking back that many calendar days for a priced observation --
  # wider than macro's as-of tolerance since bond prices are daily, not
  # quarterly.
  momentum_lookback_days: {mom_1m: 30, mom_3m: 91, mom_12m: 365}
  momentum_asof_tolerance_days: 10
  # Trailing window for the 52-week spread z-score (thesis Sec 3.3 Group A).
  spread_zscore_window_days: 364
  # A country-quarter row needs at least this fraction of the *model*
  # feature columns (below) actually observed (non-imputed) to get a real
  # signal; below that it's flagged insufficient_data, same principle as
  # Stage 1's min_observed_feature_frac.
  min_observed_feature_frac: 0.5
  # Minimum expanding-window training rows (with realized targets) before
  # the walk-forward pipeline will fit a model at all. Sample sizes here
  # are small by construction -- Stage 1's satellite-candidate tier has EM
  # rows in only 65 of 84 quarters, median 4 / mean 8.5 EM countries per
  # quarter (data/processed/stage1_risk_labels.parquet) -- so this is
  # deliberately low relative to Stage 1's threshold (15x k).
  min_training_rows: 20
  # Final Stage 2 feature set, per thesis Sec 3.3's Group A/B/C "Stage"
  # column filtered to entries marked "2" or "1 & 2" (not "1" only) --
  # deliberately narrower than reusing Stage 1's whole feature list, the
  # same discipline Stage 1 applied when it dropped vix/dxy_proxy for being
  # wrongly scoped in. Notably excludes, despite being Stage-1-available:
  # mod_duration/convexity (Group A, "1" only), current_acct_gdp/
  # fx_reserves_mo/political_stability (Group B, "1" only).
  model_features:
    - yield_spread_bps      # Group A, "1 & 2"
    - mom_1m                # Group A, "2"
    - mom_3m                # Group A, "2"
    - mom_12m                # Group A, "2"
    - carry                 # Group A, "2"
    - spread_zscore_52w     # Group A, "2"
    - debt_gdp              # Group B, "1 & 2"
    - fiscal_bal_gdp        # Group B, "1 & 2"
    - cpi_inflation         # Group B, "1 & 2"
    - real_gdp_growth       # Group B, "1 & 2"
    - us_10y                # Group C, "1 & 2"
    - curve_slope           # Group C, "1 & 2"
    - vix                   # Group C, "2"
    - dxy_proxy              # Group C, "2"
  # cds_5y and cds_bond_basis are computed and kept in the output panel for
  # inspection but deliberately excluded from model_features above -- CDS
  # (INT_CDS) is essentially DM-only in the raw pull (see CLAUDE.md), so
  # among the EM satellite universe both columns are almost entirely null;
  # same reasoning Stage 1 used to exclude cds_5y from its clustering
  # feature vector.
  random_state: 42
  lasso_alpha: 0.01
  logistic_C: 1.0
  rf_n_estimators: 200
  rf_max_depth: 4
  xgb_n_estimators: 200
  xgb_max_depth: 3
  xgb_learning_rate: 0.05
  # Sensitivity levels for the top-N satellite sleeve selection (thesis
  # Sec 4.3.5), all built rather than one hardcoded choice.
  top_n_options: [5, 10, 15]
  # Filled in by model_comparison.py's walk-forward results (thesis
  # Sec 4.3.3) -- see CLAUDE.md "Stage 2 signal" for the full writeup.
  # LASSO won BOTH framings: classification AUC 0.560 (vs RF 0.546, XGB
  # 0.550) and regression mean IC +0.076 (vs RF -0.168, XGB -0.261,
  # actually negative) across 52 walk-forward folds -- driven by the small
  # per-fold sample size (median ~4-8 EM satellite-candidate countries per
  # quarter) letting Random Forest/XGBoost overfit each refit while LASSO's
  # linear regularization generalizes better. Not a Stage-1-style default;
  # the more flexible models measurably lost here.
  chosen_model_classification: "lasso_logistic"
  chosen_model_regression: "lasso"
  output_dir: "data/processed"

# Stage 2 H2 multi-horizon robustness check (thesis Sec 2.4, 2.8 --
# pre-registered 2026-08-11, see state.md, before this was run). Tests
# whether the quarterly-horizon target (chosen to match rebalancing
# frequency, not from theory about where predictability should appear)
# is masking a stronger signal at a shorter or longer horizon. Fixed
# BEFORE running: same satellite-candidate population and features as the
# quarterly panel (only the forward-return window changes), same model
# hyperparameters as stage2_signal above (no re-tuning per horizon). All
# three horizons are reported unconditionally, per thesis Sec 2.8
# (Harvey, Liu & Zhu) applied to our own testing.
stage2_multi_horizon_robustness:
  horizons_days: {monthly: 30, quarterly: 91, semi_annual: 182}
  # quarterly reuses stage2_signal_panel.parquet's existing target as-is
  # (the real next-rebalancing-date price, not a 91-day daily lookup) --
  # only monthly/semi_annual use a forward as-of daily-price lookup.
  forward_asof_tolerance_days: 10
  output_dir: "data/processed"

# Ratings ingestion (src/data_acquisition/ingest_ratings.py, issue #3).
# Consolidates manually-collected rating-action files -- see that script's
# docstring for why this is manual rather than a scripted pull.
ratings_ingestion:
  raw_dir: "data/raw/ratings/manual"
  output_path: "data/processed/ratings_panel.csv"
  # Rating actions are same-day public announcements (agency press
  # releases), unlike World Bank/IMF's multi-month lag for periodic macro
  # releases -- available_date = date, always. Asserted by test_lag_rules.py.
  lag_days: 0
  valid_agencies: ["S&P", "Moody's", "Fitch"]
