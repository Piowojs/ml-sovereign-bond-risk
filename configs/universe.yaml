# Single source of truth for the sovereign universe used across the thesis
# pipeline (44 countries = the 53-country UNIVERSE dict in
# src/data_acquisition/eikon_sovereign_pull.py minus the 9 structural
# exclusions documented in CLAUDE.md). Any script needing the country list,
# ISO codes, or Refinitiv RICs should read this file rather than hardcoding
# a second copy.
#
# NOTE: eikon_sovereign_pull.py's own UNIVERSE dict still includes the
# excluded countries and predates this file — it should be reconciled with
# this file when that script is rewritten against lseg-data (see CLAUDE.md).

universe:
  # ── Developed Markets (18) ──────────────────────────────────────────────
  - name: "United States"
    iso2: "US"
    iso3: "USA"
    classification: "DM"
    bond_ric: "US10YT=RR"
